<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Triple Filter App v1.9-PWA-Lite</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link id="manifest-placeholder" rel="manifest">

<style>
body { font-family: Arial; margin:20px; background:#ffffff; color:#000; transition:0.3s; }
.dark { background:#121212; color:#f0f0f0; }
#spinner {
  display:none; position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
  padding:20px 30px; border-radius:8px; font-size:18px; font-weight:bold;
  background:#ffffff; color:#000000; z-index:9999;
}
input, select { padding:4px; border:1px solid #888; background:#fff; color:#000; }
.dark input, .dark select { background:#2a2a2a; color:#fff; border-color:#555; }
button { padding:6px 14px; margin-right:10px; background:#3498db; color:#fff; border:none; border-radius:4px; }
.dark button { background:#4da3ff; color:#000; }
#counts { margin-top:20px; font-size:16px; }
footer { margin-top:40px; padding-top:10px; border-top:1px solid #ccc; text-align:center; }
.dark footer { border-color:#555; }
</style>
</head>

<body>
<h2>Triple Filter App — v1.9-PWA-Lite</h2>

<button onclick="document.getElementById('readme').style.display='block'">README</button>
<br><br>

<label>🌙 Dark Mode:</label>
<input type="checkbox" id="darkToggle" onchange="toggleDarkMode()">
<br><br>

<label>Master File:</label><input type="file" id="master"><br><br>
<label>Lapsed File:</label><input type="file" id="lapsed"><br><br>
<label>Resolved File:</label><input type="file" id="resolved"><br><br>

<label>Compare Column:</label><select id="keyCol"></select><br><br>

<label>Defunct Cutoff Date:</label>
<input type="date" id="defunctCutoff" value="2024-01-01"><br><br>

<button onclick="processFiles()">Process Files</button>
<button onclick="resetApp()">Reset App</button>

<div id="spinner">Processing...</div>
<div id="counts"></div>

<div id="readme" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:#fff; padding:20px; overflow:auto; border:2px solid #000; z-index:9998;">
<h3>README</h3>
<p>v1.9 adds Reset button + Local timezone timestamps.</p>
<button onclick="document.getElementById('readme').style.display='none'">Close</button>
</div>

<footer>
© 2025 Glen Carruthers — Triple Filter App v1.9-PWA-Lite
</footer>

<script>
function toggleDarkMode(){
  if(document.getElementById("darkToggle").checked){
    document.body.classList.add("dark");
    localStorage.setItem("darkMode","1");
  } else {
    document.body.classList.remove("dark");
    localStorage.removeItem("darkMode");
  }
}
if(localStorage.getItem("darkMode")==="1"){
  document.getElementById("darkToggle").checked=true;
  document.body.classList.add("dark");
}

function showSpin(msg){
  const s=document.getElementById('spinner');
  s.textContent=msg; s.style.display='block';
}
function hideSpin(){ document.getElementById('spinner').style.display='none'; }
function delayFrame(){ return new Promise(r=>setTimeout(r,0)); }

function normID(v){
  if(v==null) return "";
  let s=String(v).trim();
  if(s.match(/^\d+\.0+$/)) s=s.replace(/\.0+$/,"");
  return s;
}

const DEFUNCT_COL="Next Payment Date";
function parseExcelDate(num){
  const base=new Date(Date.UTC(1899,11,30));
  return new Date(base.getTime()+num*86400000);
}

function isDefunctRow(row){
  const cutoff=new Date(document.getElementById("defunctCutoff").value+"T00:00:00");
  const raw=row[DEFUNCT_COL];
  if(raw==null) return true;
  const s=String(raw).trim();
  if(!s) return true;
  let d=null;
  if(typeof raw==="number") d=parseExcelDate(raw);
  else d=new Date(s);
  if(isNaN(d)) return false;
  return d < cutoff;
}

async function detectColumns(master,lapsed,resolved){
  const m=new Set(Object.keys(master[0]||{}));
  const l=new Set(Object.keys(lapsed[0]||{}));
  const r=new Set(Object.keys(resolved[0]||{}));
  const common=[...m].filter(c=>l.has(c)&&r.has(c));
  const ids=common.filter(c=>c.toLowerCase().includes("id"));
  const sel=document.getElementById('keyCol');
  sel.innerHTML="";
  ids.forEach(c=>{
    let o=document.createElement('option');
    o.value=c; o.textContent=c; sel.appendChild(o);
  });
  if(ids.includes("Member ID")) sel.value="Member ID";
}

function resetApp(){
  document.getElementById("master").value="";
  document.getElementById("lapsed").value="";
  document.getElementById("resolved").value="";
  document.getElementById("counts").innerHTML="";
  document.getElementById("keyCol").innerHTML="";
  document.getElementById("defunctCutoff").value="2024-01-01";
  hideSpin();
}

async function processFiles(){
  try{
    const mf=document.getElementById('master').files[0];
    const lf=document.getElementById('lapsed').files[0];
    const rf=document.getElementById('resolved').files[0];
    if(!mf||!lf||!rf){ alert("Select all three files."); return; }

    showSpin("Loading Master file..."); await delayFrame();
    const masterRaw=await readXLSX(mf);

    showSpin("Loading Lapsed file..."); await delayFrame();
    const lapsed=await readXLSX(lf);

    showSpin("Loading Resolved file..."); await delayFrame();
    const resolved=await readXLSX(rf);

    const defunctOut=[], master=[];
    for(const r of masterRaw){
      if(isDefunctRow(r)) defunctOut.push(r);
      else master.push(r);
    }

    await detectColumns(master,lapsed,resolved);
    const key=document.getElementById("keyCol").value;

    const masterMap=new Map();
    master.forEach(r=>{
      const k=normID(r[key]);
      if(k) masterMap.set(k,r);
    });

    const lIDs=new Set();
    lapsed.forEach(r=>{
      const k=normID(r[key]); if(k) lIDs.add(k);
    });

    const rIDs=new Set();
    resolved.forEach(r=>{
      const k=normID(r[key]); if(k) rIDs.add(k);
    });

    const active=[], lap2=[], res2=[];
    showSpin("Processing records..."); await delayFrame();

    for(const[k,row] of masterMap){
      if(rIDs.has(k)) res2.push(row);
      else if(lIDs.has(k)) lap2.push(row);
      else active.push(row);
    }

    document.getElementById("counts").innerHTML =
      "Active: "+active.length+
      "<br>Lapsed: "+lap2.length+
      "<br>Resolved: "+res2.length+
      "<br>Defunct: "+defunctOut.length;

    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(active),"ACTIVE");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(lap2),"LAPSED");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(res2),"RESOLVED");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(defunctOut),"DEFUNCT");

    showSpin("Saving output..."); await delayFrame();
    await saveWorkbook(wb);

  }catch(e){ alert("Error: "+e.message); }
  finally{ hideSpin(); }
}

function readXLSX(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        res(XLSX.utils.sheet_to_json(ws));
      }catch(err){ rej(err); }
    };
    r.onerror=err=>rej(err);
    r.readAsArrayBuffer(file);
  });
}

async function saveWorkbook(wb){
  const now=new Date();
  const yyyy=now.getFullYear();
  const mm=String(now.getMonth()+1).padStart(2,"0");
  const dd=String(now.getDate()).padStart(2,"0");
  const hh=String(now.getHours()).padStart(2,"0");
  const min=String(now.getMinutes()).padStart(2,"0");
  const ts=`${yyyy}${mm}${dd}_${hh}${min}`;

  const fname="TripleFilterOutput_"+ts+".xlsx";

  if(window.showSaveFilePicker){
    const h=await window.showSaveFilePicker({
      suggestedName:fname,
      types:[{
        description:"Excel",
        accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}
      }]
    });
    const w=await h.createWritable();
    const data=XLSX.write(wb,{bookType:"xlsx", type:"array"});
    await w.write(data);
    await w.close();
  } else {
    XLSX.writeFile(wb,fname);
  }
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>
</html>
